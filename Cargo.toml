[package]
name = "sparkeys"
version = "0.1.0"
edition = "2024"
description = "Native piano MIDI visualizer with glowing falling notes, particles and a live MIDI mode"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
# Not in the original stack list: zero-copy casting of instance/uniform structs into wgpu buffers.
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
env_logger = "0.11.11"
log = "0.4.35"
midir = "0.11.1"
midly = "0.5.3"
# Not in the original stack list: blocks on wgpu's async adapter/device requests at startup.
pollster = "1.0.1"
rfd = "0.17.2"
rtrb = "0.4.1"
rustysynth = "1.3.8"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
wgpu = "30"
winit = "0.30.13"

# Keep dependencies (synth, wgpu, parsers) fast in debug builds while our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
